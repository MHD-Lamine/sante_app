services:

  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Surcharger via un fichier .env à la racine (POSTGRES_PASSWORD=...)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: suivi_sante
    ports:
      # Accessible uniquement depuis la machine hôte
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - db
    restart: always
    command: sh -c "cron && python run.py"
    # Important : on lance cron en même temps que Flask

volumes:
  pgdata:
